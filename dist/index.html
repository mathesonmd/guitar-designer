<body>
<title>Black Chapel Guitar Designer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one working screen. Header across the top; controls on the left, the drawing in the middle,
   checks and measurements on the right. Matches the Black Chapel Fretboard Designer. */
:root{
  color-scheme:dark;
  --forge:#141210;        /* Forge Black: page */
  --forge2:#1c1916;       /* raised panel */
  --anvil:#2a2622;        /* control surface */
  --anvil2:#37322c;       /* borders */
  --brass:#c8935a;        /* Brass: accent, primary actions */
  --brass-dim:#9a7038;
  --torch:#e8552a;        /* Torch: selection, warnings */
  --bone:#ede6d8;         /* Bone: text */
  --bone-dim:#9b9388;
  --steel:#9aa0a6;        /* hardware lines */
  --ghost:#6fb7ff;        /* reference overlays */
  --ok:#8fb87a;
  --scale:#d8392b;        /* scale line */
  --font:"Inter",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--forge);color:var(--bone);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
#root{height:100%}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
a{color:var(--brass)}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--anvil2);background:linear-gradient(180deg,var(--forge2),var(--forge))}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logolink{display:flex;align-items:center;line-height:0}
.brand .logo{height:40px;width:auto;display:block}
.brand .rule{width:1px;height:26px;background:var(--anvil2)}
.brand .tool{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim);white-space:nowrap}
.top .spacer{flex:1 1 0}
.top .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{background:transparent;border:1px solid transparent;color:var(--bone);font-size:13px;font-weight:600;padding:6px 8px;border-radius:6px;width:170px;min-width:0}
.name:hover{border-color:var(--anvil2)}
.name:focus{background:var(--forge);border-color:var(--anvil2)}

.btn{background:var(--anvil);color:var(--bone);border:1px solid var(--anvil2);padding:7px 12px;border-radius:6px;cursor:pointer;
  font-size:12px;font-weight:600;letter-spacing:.02em;transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--brass-dim)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--anvil2)}
.btn.primary{background:var(--brass);color:#1a1611;border-color:var(--brass)}
.btn.primary:hover{background:#d4a85f}
.btn.small{padding:4px 9px;font-size:11px}
.btn.ghost{background:transparent}
.btn.icon{padding:6px 9px;min-width:32px}
select,input[type=text],input[type=number]{background:var(--forge);color:var(--bone);border:1px solid var(--anvil2);border-radius:6px;padding:6px 8px;font-size:12px}
select{cursor:pointer;max-width:100%;min-width:0;text-overflow:ellipsis}
input.bad{border-color:var(--torch)}

.seg{display:inline-flex;border:1px solid var(--anvil2);border-radius:6px;overflow:hidden;flex:0 0 auto}
.seg button{background:var(--forge);color:var(--bone-dim);border:0;padding:6px 11px;cursor:pointer;font-weight:700;font-size:11px;white-space:nowrap}
.seg button + button{border-left:1px solid var(--anvil2)}
.seg button.on{background:var(--brass);color:#1a1611}
.seg.wide{display:flex}
.seg.wide button{flex:1}

.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;top:calc(100% + 5px);right:0;z-index:80;background:var(--anvil);border:1px solid var(--anvil2);border-radius:8px;padding:5px;
  min-width:230px;box-shadow:0 12px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px}
.menu button{background:transparent;border:0;color:var(--bone);text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.menu button:hover{background:var(--forge2)}
.menu button small{display:block;color:var(--bone-dim);font-size:11px;margin-top:2px;white-space:normal;line-height:1.4}
.menu .sep{height:1px;background:var(--anvil2);margin:4px 2px}

/* main */
.main{display:grid;grid-template-columns:318px minmax(0,1fr) 292px;min-height:0}
.panel{overflow-y:auto;border-right:1px solid var(--anvil2);background:var(--forge2);min-height:0}
.rail{overflow-y:auto;border-left:1px solid var(--anvil2);background:var(--forge2);min-height:0}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 120% at 50% 0%,#181410 0%,var(--forge) 70%);overflow:hidden}
.stage svg.draw{display:block;width:100%;height:100%;touch-action:none;cursor:default;user-select:none}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}

.sec{border-bottom:1px solid var(--anvil2)}
.sec > h3{margin:0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);font-weight:700}
.sec > h3 button{all:unset;box-sizing:border-box;display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;
  padding:11px 16px 9px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.sec > h3 button:hover{color:var(--brass-dim)}
.sec > h3 button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.sec > h3 .hint{color:var(--bone-dim);font-weight:500;letter-spacing:.04em;text-transform:none;font-size:10px;text-align:right}
.rows{padding:2px 16px 14px;padding-left:max(16px,env(safe-area-inset-left,0px))}
.rail .rows,.rail .sec > h3 button{padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0;min-width:0}
.row > label,.row > .lbl{color:var(--bone-dim);font-size:12px;min-width:0;display:flex;align-items:center;gap:6px}
.row .ctl{display:flex;align-items:center;gap:6px;min-width:0;flex:0 0 auto}
.row.wide{flex-direction:column;align-items:stretch;gap:5px}
.row.wide .ctl,.row.wide select{width:100%}
.len{display:inline-flex;align-items:center;gap:5px}
.len input{width:78px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.len .unit{color:var(--bone-dim);font-size:11px;width:18px}
.num input{width:62px;text-align:right;font-family:var(--mono)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--bone);font-size:12px}
.check input{accent-color:var(--brass);width:15px;height:15px;margin:0}
.note{color:var(--bone-dim);font-size:11.5px;line-height:1.5;margin:6px 0 2px}
.note b{color:var(--bone);font-weight:600}
input[type=range]{accent-color:var(--brass);width:110px}

.card{border:1px solid var(--anvil2);border-radius:8px;background:var(--forge);margin:8px 0;overflow:hidden}
.card.sel{border-color:var(--torch)}
.card > .head{display:flex;align-items:center;gap:8px;padding:7px 9px;cursor:pointer}
.card > .head .t{flex:1;min-width:0;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card > .head .s{color:var(--bone-dim);font-size:11px;font-family:var(--mono)}
.card > .body{padding:2px 10px 9px;border-top:1px solid var(--anvil2)}
.x{all:unset;cursor:pointer;color:var(--bone-dim);width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-size:14px}
.x:hover{color:var(--torch);background:var(--anvil)}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* where-it-came-from badges */
.basis{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;font-size:9px;font-weight:800;cursor:help;flex:0 0 auto;
  border:1px solid var(--bone-dim);color:var(--bone-dim);position:relative;font-style:normal}
.basis.published{border-color:var(--ok);color:var(--ok)}
.basis.scaled{border-color:var(--ghost);color:var(--ghost)}
.basis.shop{border-color:var(--brass);color:var(--brass)}
.basis.assumed{border-color:var(--torch);color:var(--torch)}
.pop{position:fixed;z-index:200;width:300px;max-width:calc(100vw - 24px);background:var(--anvil);border:1px solid var(--anvil2);border-radius:8px;padding:11px 13px;
  color:var(--bone);font-size:11.5px;line-height:1.55;font-weight:400;letter-spacing:0;text-transform:none;box-shadow:0 10px 28px rgba(0,0,0,.55);text-align:left}
.pop .k{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.pop .src{display:block;margin-top:6px;color:var(--bone-dim)}

/* stage overlays */
.zoomctl{position:absolute;left:14px;bottom:36px;display:flex;flex-direction:column;gap:5px;z-index:6}
.zoomctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--anvil2);background:rgba(26,22,18,.9);color:var(--bone);font-size:17px;line-height:1;cursor:pointer;font-weight:700}
.zoomctl button:hover{border-color:var(--brass-dim)}
.zoomctl button.z{font-size:10px;letter-spacing:.04em;font-weight:600}
.hintline{position:absolute;left:14px;right:14px;bottom:10px;color:var(--bone-dim);font-size:11px;font-family:var(--mono);pointer-events:none;
  display:flex;justify-content:space-between;gap:12px;white-space:nowrap;overflow:hidden}
.float{position:absolute;z-index:7;background:rgba(28,25,22,.96);border:1px solid var(--anvil2);border-radius:8px;padding:5px;display:flex;gap:5px;align-items:center;
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:var(--anvil);border:1px solid var(--brass-dim);border-radius:8px;
  padding:8px 14px;font-size:12px;box-shadow:0 10px 26px rgba(0,0,0,.5);max-width:min(520px,calc(100% - 28px));text-align:center}
.viewopts{position:absolute;right:12px;top:12px;z-index:6;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* checks */
.find{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--anvil2);align-items:flex-start}
.find:first-child{border-top:0}
.find .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.find.warn .dot{background:var(--torch)}
.find.note .dot{background:transparent;border:2px solid var(--brass)}
.find.ok .dot{background:var(--ok)}
.find .tx{min-width:0;flex:1}
.find .ti{font-weight:600;font-size:12px;line-height:1.4}
.find .de{color:var(--bone-dim);font-size:11.5px;line-height:1.5;margin-top:2px}
.find button.go{all:unset;cursor:pointer;display:block;width:100%}
.find button.go:hover .ti{color:var(--brass)}
.tally{display:flex;gap:12px;font-size:11px;color:var(--bone-dim);font-family:var(--mono)}
.tally b{font-weight:700}
.tally .w{color:var(--torch)} .tally .n{color:var(--brass)} .tally .o{color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12px;margin:4px 0}
.kv dt{color:var(--bone-dim);margin:0} .kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* templates view */
.tview{display:grid;grid-template-rows:minmax(0,1fr) auto;height:100%}
.tview .sheetwrap{min-height:0;position:relative}
.tbar{border-top:1px solid var(--anvil2);background:var(--forge2);padding:12px 16px;display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center}
.tbar .legendkey{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--bone-dim)}
.tbar .legendkey i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:18px}
.dialog{background:var(--forge2);border:1px solid var(--anvil2);border-radius:12px;max-width:820px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--anvil2)}
.dialog header h2{margin:0;font-size:15px;font-weight:700}
.dialog .content{overflow:auto;padding:6px 18px 18px;line-height:1.55}
.dialog h4{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);margin:18px 0 6px}
.dialog ul.plain{margin:0;padding-left:18px}
.dialog ul.plain li{margin:3px 0}
.dialog table{border-collapse:collapse;width:100%;font-size:12px}
.dialog td,.dialog th{text-align:left;padding:6px 10px 6px 0;vertical-align:top;border-top:1px solid var(--anvil2)}
.dialog th{color:var(--bone-dim);font-weight:600;border-top:0}
.dialog td.v{font-family:var(--mono);white-space:nowrap}
.tablewrap{overflow-x:auto}
.starters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.starter{background:var(--forge);border:1px solid var(--anvil2);border-radius:10px;padding:10px;cursor:pointer;color:var(--bone);text-align:left;font-size:12px}
.starter:hover{border-color:var(--brass)}
.starter svg{width:100%;height:120px;display:block;margin-bottom:8px}
.starter b{display:block;font-size:12.5px} .starter span{color:var(--bone-dim);font-size:11px;line-height:1.4;display:block;margin-top:2px}

.loadfail{padding:40px 24px;max-width:520px;margin:0 auto;line-height:1.6}

@media (max-width:1180px){ .main{grid-template-columns:300px minmax(0,1fr)} .rail{grid-column:1 / -1;border-left:0;border-top:1px solid var(--anvil2);max-height:38vh} .main{grid-template-rows:minmax(0,1fr) auto} }
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .stage{height:62vh;min-height:340px;order:-1}
  .panel{border-right:0;max-height:none}
  .rail{max-height:none}
  .rows,.sec > h3 button{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand .logo{height:32px}
  .name{width:130px}
  .top .cta{display:none} /* the view switch already has Templates */
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
